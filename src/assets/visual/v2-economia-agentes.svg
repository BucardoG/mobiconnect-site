<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" fill="none" role="img" aria-labelledby="t" aria-describedby="d">
  <title id="t">De personas a agentes AI: un contrato explícito para consumir APIs</title>
  <desc id="d">La autonomía del consumidor aumenta desde personas que consumen vía interfaz, a aplicaciones que consumen vía API, hasta agentes AI que consumen de forma autónoma. El tramo de agentes, destacado en teal, se conecta desde su centro a un contrato legible por máquina: permiso explícito, cuota restante, referencia de precio y respuesta 503 si el sistema no puede decidir. Cuanto más autónomo el consumidor, más necesario el contrato explícito.</desc>

  <text x="40" y="36" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.4" fill="#78716c">TRANSICIÓN DEL CONSUMIDOR</text>
  <text x="40" y="60" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#0a0a0a">De personas a agentes AI</text>
  <path d="M40 78H920" stroke="#e7e5e4" stroke-width="1"/>

  <g stroke-width="1">
    <rect x="40" y="112" width="260" height="96" rx="8" fill="#ffffff" stroke="#e7e5e4"/>
    <rect x="350" y="112" width="260" height="96" rx="8" fill="#ffffff" stroke="#e7e5e4"/>
    <rect x="660" y="112" width="260" height="96" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.25"/>
    <rect x="660" y="240" width="260" height="140" rx="8" fill="#ffffff" stroke="#0f766e"/>
    <path d="M660 280H920M680 310H900M680 334H900M680 358H900" stroke="#e7e5e4"/>
  </g>

  <g stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 160H350M344 154L350 160L344 166" stroke="#78716c"/>
    <path d="M610 160H660M654 154L660 160L654 166" stroke="#0f766e"/>
    <path d="M790 208V240" stroke="#0f766e"/>
  </g>

  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#78716c" text-anchor="middle">
    <text x="325" y="100">+ autonomía</text>
    <text x="635" y="100">+ autonomía</text>
  </g>

  <g font-family="Inter, -apple-system, Segoe UI, sans-serif">
    <g font-size="23" font-weight="600">
      <text x="64" y="146" fill="#0a0a0a">Personas</text>
      <text x="374" y="146" fill="#0a0a0a">Aplicaciones</text>
      <text x="684" y="146" fill="#115e59">Agentes AI</text>
    </g>
    <g font-size="15">
      <text x="64" y="175" fill="#57534e">Consumo vía interfaz</text>
      <text x="374" y="175" fill="#57534e">Consumo vía API</text>
      <text x="684" y="175" fill="#0f766e">Consumo autónomo</text>
    </g>
    <text x="680" y="264" font-size="14" font-weight="600" fill="#115e59">Contrato legible por máquina</text>
    <text x="40" y="406" font-size="13" fill="#57534e">Cuanto más autónomo el consumidor, más necesario el contrato explícito.</text>
  </g>

  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">
    <g fill="#78716c">
      <text x="680" y="298">permiso:</text>
      <text x="680" y="322">cuota:</text>
      <text x="680" y="346">precio:</text>
      <text x="680" y="370">si no decide:</text>
    </g>
    <g text-anchor="end" fill="#0a0a0a">
      <text x="900" y="298" fill="#0f766e">explícito</text>
      <text x="900" y="322">restante</text>
      <text x="900" y="346">price_ref</text>
      <text x="900" y="370" font-weight="600">503</text>
    </g>
  </g>
</svg>

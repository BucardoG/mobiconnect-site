<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" fill="none" role="img" aria-labelledby="t" aria-describedby="d">
  <title id="t">Idempotency: one logical call, one charge</title>
  <desc id="d">Sequence between the Consumer and Entitlements. At t1, the call with correlation_id 7f3c… returns 200 allow:true and is metered once. At t2, a retry after a timeout using the same identifier returns 409 duplicate_correlation_id and is not charged again. The audit log retains a single row: correlation_id 7f3c…, result allow, units 1, and charge 1×.</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7" stroke="#57534e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7" stroke="#0f766e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="Inter, -apple-system, Segoe UI, sans-serif">
    <text x="32" y="36" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.4" fill="#78716c">IDEMPOTENCY · SEQUENCE</text>
    <text x="32" y="60" font-size="18" font-weight="600" fill="#0a0a0a">Same identifier, no double charge</text>
    <path d="M32 76 H688" stroke="#e7e5e4"/>

    <rect x="32" y="86" width="112" height="28" rx="8" fill="#ffffff" stroke="#e7e5e4"/>
    <rect x="566" y="86" width="128" height="28" rx="8" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="88" y="104" text-anchor="middle" font-size="13" fill="#57534e">Consumer</text>
    <text x="630" y="104" text-anchor="middle" font-size="13" fill="#0a0a0a">Entitlements</text>
    <path d="M88 114 V291 M630 114 V291" stroke="#d6d3d1" stroke-dasharray="3 5"/>

    <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#57534e">
      <text x="48" y="144">t1</text>
      <text x="610" y="134" text-anchor="end">correlation_id 7f3c…</text>
    </g>
    <path d="M88 140 H630" stroke="#57534e" stroke-width="1.25" marker-end="url(#arrow-ink)"/>
    <path d="M630 170 H435 M285 170 H88" stroke="#0f766e" stroke-width="1.25" marker-end="url(#arrow-teal)"/>
    <rect x="285" y="156" width="150" height="28" rx="6" fill="#f0fdfa" stroke="#0f766e"/>
    <text x="360" y="174" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#0f766e">200 allow:true</text>
    <text x="360" y="199" text-anchor="middle" font-size="12" fill="#0f766e">metered once</text>

    <path d="M108 209 H610" stroke="#e7e5e4"/>
    <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#57534e">
      <text x="48" y="233">t2</text>
      <text x="108" y="223">retry · timeout</text>
      <text x="610" y="223" text-anchor="end">correlation_id 7f3c…</text>
    </g>
    <path d="M88 229 H630" stroke="#57534e" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#arrow-ink)"/>
    <path d="M630 259 H482 M238 259 H88" stroke="#57534e" stroke-width="1.25" marker-end="url(#arrow-ink)"/>
    <path d="M88 253 V265" stroke="#57534e" stroke-width="1.25"/>
    <rect x="238" y="245" width="244" height="28" rx="6" fill="#ffffff" stroke="#d6d3d1"/>
    <text x="360" y="263" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#0a0a0a">409 duplicate_correlation_id</text>
    <text x="360" y="288" text-anchor="middle" font-size="12" fill="#57534e">not charged again</text>

    <text x="32" y="304" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#78716c">AUDIT LOG</text>
    <rect x="32" y="312" width="656" height="46" rx="8" fill="#ffffff" stroke="#e7e5e4"/>
    <path d="M32 335 H688 M260 312 V358 M424 312 V358 M558 312 V358" stroke="#e7e5e4"/>
    <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">
      <g fill="#78716c">
        <text x="48" y="328">CORRELATION_ID</text>
        <text x="276" y="328">RESULT</text>
        <text x="440" y="328">UNITS</text>
        <text x="574" y="328">CHARGE</text>
      </g>
      <text x="48" y="351" fill="#0a0a0a">7f3c…</text>
      <text x="276" y="351" fill="#0f766e">allow</text>
      <text x="456" y="351" fill="#0a0a0a">1</text>
      <text x="574" y="351" fill="#0a0a0a">1×</text>
    </g>
    <path d="M444 342 V352" stroke="#0f766e" stroke-width="1.5" stroke-linecap="round"/>
    <text x="360" y="383" text-anchor="middle" font-size="16" font-weight="600" fill="#0a0a0a">One logical call = one charge.</text>
  </g>
</svg>

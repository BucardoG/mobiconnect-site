<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" fill="none" role="img" aria-labelledby="t" aria-describedby="d">
  <title id="t">Fail-closed: uncertainty never grants access</title>
  <desc id="d">A comparison of the fail-open behavior we avoid and the fail-closed approach used by Mobiconnect. On the left, the faded, crossed-out flow lets traffic through without a contract when the decision point is unavailable. On the right, the request reaches the unavailable decision point, is blocked, and receives 503 pdp_unavailable. Nothing is served without a decision.</desc>
  <defs>
    <marker id="v4-arrow-muted" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 1L6 4L2 7" stroke="#78716c" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="v4-arrow-teal" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 1L6 4L2 7" stroke="#0f766e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="Inter, -apple-system, Segoe UI, sans-serif">
    <text x="24" y="36" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.4" fill="#78716c">ENTITLEMENTS · DECISIONS ON FAILURE</text>
    <text x="24" y="60" font-size="20" font-weight="600" fill="#0a0a0a">No decision, no access.</text>
    <path d="M24 80H696" stroke="#e7e5e4" stroke-width="1"/>

    <text x="24" y="106" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.4" fill="#78716c">WHAT WE AVOID</text>
    <text x="24" y="130" font-size="16" font-weight="600" fill="#57534e">Fail-open</text>
    <text x="372" y="106" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.4" fill="#0f766e">MOBICONNECT</text>
    <text x="372" y="130" font-size="16" font-weight="600" fill="#0a0a0a">Fail-closed</text>

    <rect x="24" y="144" width="324" height="214" rx="8" fill="#ffffff" stroke="#e7e5e4"/>
    <rect x="372" y="144" width="324" height="214" rx="8" fill="#ffffff" stroke="#d6d3d1"/>

    <g opacity="0.6">
      <rect x="136" y="158" width="100" height="30" rx="6" stroke="#d6d3d1"/>
      <text x="186" y="178" text-anchor="middle" font-size="14" fill="#78716c">Request</text>
      <path d="M186 188V206" stroke="#78716c" stroke-width="1.25" stroke-dasharray="3 3" marker-end="url(#v4-arrow-muted)"/>
      <rect x="102" y="206" width="168" height="58" rx="6" stroke="#d6d3d1" stroke-dasharray="4 4"/>
      <text x="186" y="228" text-anchor="middle" font-size="14" font-weight="500" fill="#78716c">Decision point</text>
      <text x="186" y="247" text-anchor="middle" font-size="13" fill="#78716c">unavailable</text>
      <path d="M186 264V296" stroke="#78716c" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#v4-arrow-muted)"/>
      <rect x="74" y="296" width="224" height="30" rx="6" stroke="#d6d3d1"/>
      <text x="186" y="316" text-anchor="middle" font-size="13" fill="#78716c">Traffic without a contract</text>
    </g>
    <path d="M164 272L208 290M208 272L164 290" stroke="#57534e" stroke-width="1.25" stroke-linecap="round"/>

    <rect x="484" y="158" width="100" height="30" rx="6" fill="#f0fdfa" stroke="#14b8a6"/>
    <text x="534" y="178" text-anchor="middle" font-size="14" fill="#57534e">Request</text>
    <path d="M534 188V206" stroke="#0f766e" stroke-width="1.5" marker-end="url(#v4-arrow-teal)"/>
    <rect x="450" y="206" width="168" height="58" rx="6" fill="#ffffff" stroke="#d6d3d1"/>
    <text x="534" y="228" text-anchor="middle" font-size="14" font-weight="500" fill="#0a0a0a">Decision point</text>
    <text x="534" y="247" text-anchor="middle" font-size="13" fill="#57534e">unavailable</text>
    <path d="M534 264V286" stroke="#0f766e" stroke-width="1.5" marker-end="url(#v4-arrow-teal)"/>
    <path d="M510 286H558" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="422" y="298" width="224" height="30" rx="6" fill="#f0fdfa" stroke="#14b8a6"/>
    <text x="534" y="318" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#115e59">503 pdp_unavailable</text>
    <text x="534" y="344" text-anchor="middle" font-size="13" fill="#57534e">Nothing is served without a decision.</text>

    <text x="360" y="386" text-anchor="middle" font-size="16" font-weight="500" fill="#0a0a0a">Uncertainty never grants access.</text>
  </g>
</svg>

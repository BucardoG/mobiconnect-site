  <title id="t">Íconos de productos Mobiconnect</title>
  <desc id="d">Cinco íconos lineales en celdas independientes: Entitlements como compuerta con muestras, salida allow en teal y salida deny hueca en tinta con tope; Plataforma de APIs como un nodo central conectado a cuatro satélites y una onda; Open Finance como dos bloques unidos por un arco con tres muestras; Number Intelligence como una retícula de nueve puntos junto a una lupa que no los oculta; People como una silueta humana y un agente trapezoidal conectados.</desc>


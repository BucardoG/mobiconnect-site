  <text x="764" y="338" fill="#78716c" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">en diseño</text>

  <path d="M624 372V480Q624 488 632 488H718" stroke="#d6d3d1" stroke-width="1.25" marker-end="url(#arrow-neutral)"/>
  <g stroke="#0f766e" stroke-width="1.25" stroke-linecap="round">
    <path d="M648 484V492M662 481V495M676 478V498M690 481V495M704 484V492"/>
  </g>
  <rect x="718" y="464" width="206" height="48" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.25"/>
  <text x="738" y="492" fill="#57534e" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="500">Registro auditable</text>

    <path d="M720 259V312Q720 320 728 320H748" marker-end="url(#arrow-teal)"/>
  </g>
  <text x="672" y="244" fill="#0f766e" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">allow</text>

  <g stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="round">
    <path d="M310 372V412"/>
    <path d="M300 412H320"/>
  </g>
  <g fill="#57534e" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">
    <text x="326" y="398">deny</text>
    <text x="326" y="434">no se sirve · motivo en enum cerrado</text>
  </g>

  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" letter-spacing="1.2">
    <rect x="36" y="146" width="160" height="66" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.25"/>
    <text x="56" y="183" fill="#57534e">PERSONA</text>
    <rect x="36" y="226" width="160" height="66" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.25"/>
    <text x="56" y="263" fill="#57534e">APLICACIÓN</text>

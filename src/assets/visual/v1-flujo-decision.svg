<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none" role="img" aria-labelledby="t" aria-describedby="d">
  <title id="t">Decisión previa a cada consumo de API</title>
  <desc id="d">Una persona, una aplicación o un agente AI solicita acceso. Los tres orígenes convergen en una única entrada a Entitlements, que decide antes de cada consumo según permiso, cuota y precio, y devuelve la razón. La salida allow conduce a las APIs de red CAMARA, en construcción, o a finanzas abiertas, en diseño. Cada unidad servida se mide en el registro auditable. La salida deny nace del borde inferior y termina en un tope: no se sirve y se devuelve un motivo en enum cerrado. Una línea con muestras conecta Entitlements con el registro auditable.</desc>

  <defs>
    <marker id="arrow-teal" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L7 4L1 7" stroke="#0f766e" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-neutral" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L7 4L1 7" stroke="#78716c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="36" y="36" fill="#78716c" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.2">ENTITLEMENTS · DECISIÓN PREVIA</text>
  <text x="36" y="60" fill="#0a0a0a" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="600">Antes de cada consumo de API</text>
  <path d="M36 80H924" stroke="#e7e5e4" stroke-width="1"/>

  <g stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
    <path d="M196 179H220Q228 179 228 187V259" stroke="#d6d3d1"/>
    <path d="M196 259H228" stroke="#d6d3d1"/>
    <path d="M196 339H220Q228 339 228 331V259" stroke="#0f766e"/>
    <path d="M228 259H268" stroke="#78716c" marker-end="url(#arrow-neutral)"/>
  </g>
  <circle cx="228" cy="259" r="3" fill="#ffffff" stroke="#78716c" stroke-width="1.25"/>

  <g stroke="#0f766e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M656 259H720"/>

  <text x="764" y="206" fill="#78716c" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" letter-spacing="1.2">CAMARA</text>
  <text x="764" y="222" fill="#78716c" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">en construcción</text>

  <rect x="748" y="278" width="176" height="84" rx="8" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.25" stroke-dasharray="4 3"/>

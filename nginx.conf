server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.html;
    server_tokens off;

    # Seguridad mínima (paridad con landings del homelab)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # HTML siempre revalida: tras cada deploy el visitante recibe la versión nueva
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Astro static: sin trailing slash en archivos, con slash en directorios
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Assets con cache largo (hasheados por Astro)
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

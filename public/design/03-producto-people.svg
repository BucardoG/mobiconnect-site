<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1895" viewBox="0 0 1440 1895">
<title>Mobiconnect — Producto People (1440)</title>
<rect x="0" y="0" width="1440" height="1895" fill="#FAFAF9"/>
<g id="nav">
  <g transform="translate(96,16) scale(0.78)">
  <rect x="2" y="2" width="4" height="28" fill="#1C1917" rx="1"/>
  <rect x="26" y="2" width="4" height="28" fill="#1C1917" rx="1"/>
  <rect x="8" y="19" width="4" height="11" fill="#1C1917" rx="1"/>
  <rect x="14" y="13" width="4" height="17" fill="#1C1917" rx="1"/>
  <rect x="20" y="7" width="4" height="23" fill="#B45309" rx="1"/>
  <text x="44" y="33" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#1C1917" letter-spacing="-0.5">mobiconnect</text>
  </g>
  <text x="476" y="39" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#52525B">Entitlements</text>
  <text x="580" y="39" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#52525B">People</text>
  <text x="684" y="39" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#52525B">Grupo</text>
  <text x="788" y="39" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#52525B">Contacto</text>
  <rect x="1148" y="10" width="100" height="40" fill="#B45309" rx="6"/>
  <text x="1198.0" y="35.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">Contacto</text>
  <text x="1024" y="39" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#71717A">EN</text>
  <line x1="0" y1="80" x2="1440" y2="80" stroke="#E7E5E4" stroke-width="1"/>
</g>
<g id="crumb">
  <text x="96" y="116" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="400" fill="#71717A" letter-spacing="0.8">productos / people</text>
</g>
<g id="hero">
  <text x="96" y="192" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="500" fill="#B45309" letter-spacing="1.4">PRODUCTO · 02</text>
  <text x="96" y="280" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="600" fill="#1C1917" letter-spacing="-1.2">People</text>
  <text x="96" y="338" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#52525B">Un sistema de RR.HH. diseñado desde cero para equipos híbridos: personas y agentes</text>
  <text x="96" y="364" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#52525B">AI en el mismo registro, con reglas claras — se mide resultados, no actividad.</text>
</g>
<g id="hero-cta">
  <rect x="96" y="404" width="165" height="46" fill="#B45309" rx="6"/>
  <text x="178.5" y="432.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">Hablar de People</text>
  <rect x="277" y="404" width="165" height="46" fill="#FFFFFF" rx="6" stroke="#D6D3D1" stroke-width="1"/>
  <text x="359.5" y="432.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#1C1917" text-anchor="middle">Ver Entitlements</text>
</g>
<g id="ficha-producto">
  <rect x="984" y="172" width="330" height="216" fill="#FFFFFF" rx="8" stroke="#E7E5E4" stroke-width="1"/>
  <rect x="984" y="172" width="3" height="216" fill="#B45309"/>
  <text x="1008" y="208" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" fill="#71717A" letter-spacing="1.2">FICHA DE PRODUCTO</text>
  <text x="1008" y="244" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" fill="#71717A" letter-spacing="1.1">PRODUCTO</text>
  <text x="1104" y="244" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#1C1917">WORKFORCE OS</text>
  <line x1="1008" y1="274" x2="1290" y2="274" stroke="#E7E5E4" stroke-width="1"/>
  <text x="1008" y="282" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" fill="#71717A" letter-spacing="1.1">EQUIPOS</text>
  <text x="1104" y="282" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#1C1917">PERSONAS + AGENTES AI</text>
  <line x1="1008" y1="312" x2="1290" y2="312" stroke="#E7E5E4" stroke-width="1"/>
  <text x="1008" y="320" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" fill="#71717A" letter-spacing="1.1">MEDIDA</text>
  <text x="1104" y="320" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#1C1917">RESULTADOS, NO ACTIVIDAD</text>
  <line x1="1008" y1="350" x2="1290" y2="350" stroke="#E7E5E4" stroke-width="1"/>
  <text x="1008" y="358" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" fill="#71717A" letter-spacing="1.1">REGLA</text>
  <text x="1104" y="358" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#1C1917">AGENTES PROPONEN</text>
</g>
<line x1="96" y1="492" x2="1344" y2="492" stroke="#E7E5E4" stroke-width="1"/>
<g id="cap-head">
  <text x="96" y="556" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="500" fill="#B45309" letter-spacing="1.4">CAPACIDADES</text>
  <text x="96" y="600" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#1C1917" letter-spacing="-0.6">Un registro para todo el equipo — humano o digital.</text>
</g>
<g id="cap-1">
  <rect x="96" y="638" width="400" height="236" fill="#FFFFFF" rx="10" stroke="#E7E5E4" stroke-width="1"/>
  <text x="124" y="682" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#B45309" letter-spacing="1.4">C·01</text>
  <text x="124" y="718" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="600" fill="#1C1917">Registro unificado</text>
  <text x="124" y="750" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">Personas y trabajadores digitales (agentes</text>
  <text x="124" y="771" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">AI) en un solo sistema, con identidad, rol</text>
  <text x="124" y="792" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">y responsabilidades explícitas.</text>
</g>
<g id="cap-2">
  <rect x="520" y="638" width="400" height="236" fill="#FFFFFF" rx="10" stroke="#E7E5E4" stroke-width="1"/>
  <text x="548" y="682" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#B45309" letter-spacing="1.4">C·02</text>
  <text x="548" y="718" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="600" fill="#1C1917">Agentes proponen</text>
  <text x="548" y="750" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">La cadena de decisión queda registrada:</text>
  <text x="548" y="771" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">cada propuesta lleva contexto y un humano</text>
  <text x="548" y="792" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">responsable detrás. Automatización con</text>
  <text x="548" y="813" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">nombre y apellido.</text>
</g>
<g id="cap-3">
  <rect x="944" y="638" width="400" height="236" fill="#FFFFFF" rx="10" stroke="#E7E5E4" stroke-width="1"/>
  <text x="972" y="682" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#B45309" letter-spacing="1.4">C·03</text>
  <text x="972" y="718" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="600" fill="#1C1917">Resultados, no actividad</text>
  <text x="972" y="750" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">Scorecards anclados a resultados definidos</text>
  <text x="972" y="771" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">por rol. La actividad es señal; el</text>
  <text x="972" y="792" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">resultado es la medida.</text>
</g>
<g id="cap-4">
  <rect x="96" y="898" width="400" height="236" fill="#FFFFFF" rx="10" stroke="#E7E5E4" stroke-width="1"/>
  <text x="124" y="942" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#B45309" letter-spacing="1.4">C·04</text>
  <text x="124" y="978" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="600" fill="#1C1917">Scorecards por rol</text>
  <text x="124" y="1010" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">Pesos y criterios explícitos por rol,</text>
  <text x="124" y="1031" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">revisables y versionados. Nada de cajas</text>
  <text x="124" y="1052" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">negras de calificación.</text>
</g>
<g id="cap-5">
  <rect x="520" y="898" width="400" height="236" fill="#FFFFFF" rx="10" stroke="#E7E5E4" stroke-width="1"/>
  <text x="548" y="942" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#B45309" letter-spacing="1.4">C·05</text>
  <text x="548" y="978" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="600" fill="#1C1917">Señales conectadas</text>
  <text x="548" y="1010" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">La evaluación se alimenta del trabajo real</text>
  <text x="548" y="1031" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">— sistemas, repositorios, registros</text>
  <text x="548" y="1052" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">operativos — no del autodiagnóstico.</text>
</g>
<g id="cap-6">
  <rect x="944" y="898" width="400" height="236" fill="#FFFFFF" rx="10" stroke="#E7E5E4" stroke-width="1"/>
  <text x="972" y="942" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#B45309" letter-spacing="1.4">C·06</text>
  <text x="972" y="978" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="600" fill="#1C1917">Revisiones con evidencia</text>
  <text x="972" y="1010" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">Cada ciclo cierra con evidencia trazable:</text>
  <text x="972" y="1031" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">qué se midió, con qué peso y qué se</text>
  <text x="972" y="1052" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">decidió.</text>
</g>
<line x1="96" y1="1198" x2="1344" y2="1198" stroke="#E7E5E4" stroke-width="1"/>
<g id="how-head">
  <text x="96" y="1262" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="500" fill="#B45309" letter-spacing="1.4">CÓMO FUNCIONA</text>
  <text x="96" y="1306" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#1C1917" letter-spacing="-0.6">Medir equipos híbridos, en tres movimientos.</text>
</g>
<line x1="126" y1="1372" x2="914" y2="1372" stroke="#D6D3D1" stroke-width="1"/>
<g id="paso-01">
  <circle cx="106" cy="1372" r="20" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="106" y="1377" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#B45309" text-anchor="middle">01</text>
  <text x="148" y="1378" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#1C1917">Define resultados</text>
  <text x="148" y="1410" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">Por cada rol — humano o agente — se</text>
  <text x="148" y="1431" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">declaran resultados y pesos. Sin</text>
  <text x="148" y="1452" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">resultados definidos no hay scorecard.</text>
</g>
<g id="paso-02">
  <circle cx="522" cy="1372" r="20" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="522" y="1377" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#B45309" text-anchor="middle">02</text>
  <text x="564" y="1378" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#1C1917">Conecta las señales</text>
  <text x="564" y="1410" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">El sistema se alimenta del trabajo real:</text>
  <text x="564" y="1431" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">sistemas internos, código y registros</text>
  <text x="564" y="1452" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">operativos.</text>
</g>
<g id="paso-03">
  <circle cx="938" cy="1372" r="20" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="938" y="1377" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#B45309" text-anchor="middle">03</text>
  <text x="980" y="1378" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#1C1917">Revisa y decide</text>
  <text x="980" y="1410" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">Ciclos de revisión con scorecards y</text>
  <text x="980" y="1431" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">evidencia. Los humanos deciden; el sistema</text>
  <text x="980" y="1452" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">recuerda.</text>
</g>
<g id="regla">
  <rect x="96" y="1507" width="1248" height="170" fill="#FEF3E7" rx="12" stroke="#FDE6CE" stroke-width="1"/>
  <text x="136" y="1559" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="500" fill="#B45309" letter-spacing="1.4">LA REGLA</text>
  <text x="136" y="1611" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" fill="#1C1917" letter-spacing="-0.5">Los agentes proponen. Los humanos deciden.</text>
  <text x="136" y="1643" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#52525B">Cada propuesta de un agente lleva contexto y un humano responsable detrás. La cadena de decisión queda registrada.</text>
</g>
<g id="footer">
  <line x1="96" y1="1753" x2="1344" y2="1753" stroke="#E7E5E4" stroke-width="1"/>
  <g transform="translate(96,1785) scale(0.7)">
  <rect x="2" y="2" width="4" height="28" fill="#1C1917" rx="1"/>
  <rect x="26" y="2" width="4" height="28" fill="#1C1917" rx="1"/>
  <rect x="8" y="19" width="4" height="11" fill="#1C1917" rx="1"/>
  <rect x="14" y="13" width="4" height="17" fill="#1C1917" rx="1"/>
  <rect x="20" y="7" width="4" height="23" fill="#B45309" rx="1"/>
  <text x="44" y="33" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#1C1917" letter-spacing="-0.5">mobiconnect</text>
  </g>
  <text x="396" y="1809" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#71717A">Servicios de AI y high-tech para el operador soberano del grupo.</text>
  <text x="396" y="1831" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#52525B">Productos · Grupo · Contacto</text>
  <text x="1344" y="1809" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="400" fill="#71717A" text-anchor="end">© 2026 Mobiconnect — Inversiones Bucardo Zúñiga Limitada</text>
  <text x="1344" y="1831" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="400" fill="#71717A" text-anchor="end">Santiago de Chile</text>
</g>
</svg>

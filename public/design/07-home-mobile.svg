  <text x="48" y="738" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" fill="#71717A" letter-spacing="1.2">FICHA DEL SISTEMA</text>
  <text x="48" y="774" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" fill="#71717A" letter-spacing="1.1">GRUPO</text>
  <text x="144" y="774" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#1C1917">INV. BUCARDO ZÚÑIGA</text>
  <line x1="48" y1="804" x2="342" y2="804" stroke="#E7E5E4" stroke-width="1"/>
  <text x="48" y="812" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" fill="#71717A" letter-spacing="1.1">OPERADOR</text>
  <text x="144" y="812" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#1C1917">AIRTIME CONNECT</text>
  <line x1="48" y1="842" x2="342" y2="842" stroke="#E7E5E4" stroke-width="1"/>
  <text x="48" y="850" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" fill="#71717A" letter-spacing="1.1">LICENCIA</text>
  <text x="144" y="850" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#1C1917">SUBTEL 114/260/427</text>
  <line x1="48" y1="880" x2="342" y2="880" stroke="#E7E5E4" stroke-width="1"/>
  <text x="48" y="888" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" fill="#71717A" letter-spacing="1.1">PRESENCIA</text>
  <text x="144" y="888" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#1C1917">7 PAÍSES</text>
<line x1="24" y1="942" x2="366" y2="942" stroke="#E7E5E4" stroke-width="1"/>
<text x="24" y="982" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="500" fill="#B45309" letter-spacing="1.4">PRODUCTOS</text>
<rect x="24" y="1022" width="342" height="236" fill="#FFFFFF" rx="10" stroke="#E7E5E4" stroke-width="1"/>
<text x="48" y="1066" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#B45309" letter-spacing="1.4">P·01</text>
<text x="48" y="1106" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#1C1917" letter-spacing="-0.6">Entitlements</text>
<text x="48" y="1138" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52525B">La capa comercial de las APIs: planes,</text>
<text x="48" y="1160" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52525B">cuotas, licencias y medición para quien</text>
<text x="48" y="1182" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52525B">vende conectividad como producto.</text>
<text x="48" y="1232" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#B45309">Ver producto  →</text>
<rect x="24" y="1278" width="342" height="236" fill="#FFFFFF" rx="10" stroke="#E7E5E4" stroke-width="1"/>
<text x="48" y="1322" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#B45309" letter-spacing="1.4">P·02</text>
<text x="48" y="1362" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#1C1917" letter-spacing="-0.6">People</text>
<text x="48" y="1394" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52525B">Personas y agentes AI en el mismo</text>
<text x="48" y="1416" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52525B">registro, medidos por resultados — no</text>
<text x="48" y="1438" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52525B">por actividad.</text>
<text x="48" y="1488" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#B45309">Ver producto  →</text>
<g id="cta-movil">
  <rect x="24" y="1550" width="342" height="280" fill="#FEF3E7" rx="12" stroke="#FDE6CE" stroke-width="1"/>
  <text x="48" y="1594" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="500" fill="#B45309" letter-spacing="1.4">CONTACTO</text>
  <text x="48" y="1634" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#1C1917" letter-spacing="-0.4">Hable con quien</text>
  <text x="48" y="1666" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#1C1917" letter-spacing="-0.4">construye.</text>
  <text x="48" y="1702" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52525B">Contacto fundador-led: conversaciones</text>
  <text x="48" y="1722" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52525B">técnicas directas, sin funnels.</text>
  <rect x="48" y="1754" width="188" height="44" fill="#B45309" rx="6"/>
  <text x="142.0" y="1781.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">Iniciar conversación</text>
</g>

<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1954" viewBox="0 0 390 1954">
<title>Mobiconnect — Home móvil (390)</title>
<rect x="0" y="0" width="390" height="1954" fill="#FAFAF9"/>
<g transform="translate(24,40) scale(0.66)">
  <rect x="2" y="2" width="4" height="28" fill="#1C1917" rx="1"/>
  <rect x="26" y="2" width="4" height="28" fill="#1C1917" rx="1"/>
  <rect x="8" y="19" width="4" height="11" fill="#1C1917" rx="1"/>
  <rect x="14" y="13" width="4" height="17" fill="#1C1917" rx="1"/>

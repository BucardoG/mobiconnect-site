  <text x="44" y="33" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#1C1917" letter-spacing="-0.5">mobiconnect</text>
  </g>
<line x1="0" y1="88" x2="390" y2="88" stroke="#E7E5E4" stroke-width="1"/>
<text x="24" y="140" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="500" fill="#B45309" letter-spacing="1.4">PLATAFORMA DE AI Y HIGH-TECH</text>
<text x="24" y="208" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#1C1917" letter-spacing="-1.2">La capa de</text>
<text x="24" y="252" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#1C1917" letter-spacing="-1.2">inteligencia del</text>
<text x="24" y="296" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#1C1917" letter-spacing="-1.2">operador</text>
<text x="24" y="340" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#1C1917" letter-spacing="-1.2">soberano.</text>
<text x="24" y="392" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#52525B">Mobiconnect diseña y opera los</text>
<text x="24" y="416" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#52525B">servicios que rodean a Airtime</text>
<text x="24" y="440" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#52525B">Connect: la capa comercial de las</text>
<text x="24" y="464" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#52525B">APIs y el sistema de desempeño para</text>
<text x="24" y="488" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#52525B">equipos híbridos de personas y</text>
<text x="24" y="512" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#52525B">agentes.</text>
<rect x="24" y="560" width="226" height="46" fill="#B45309" rx="6"/>
  <text x="137.0" y="588.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">Conversar con el fundador</text>
<rect x="24" y="626" width="165" height="46" fill="#FFFFFF" rx="6" stroke="#D6D3D1" stroke-width="1"/>

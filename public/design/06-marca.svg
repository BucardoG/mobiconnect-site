<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1082" viewBox="0 0 1440 1082">
<title>Mobiconnect — Marca · Dirección A</title>
<rect x="0" y="0" width="1440" height="1082" fill="#FAFAF9"/>
<g id="titulo">
  <text x="96" y="96" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="500" fill="#B45309" letter-spacing="1.4">MARCA</text>
  <text x="96" y="180" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="600" fill="#1C1917" letter-spacing="-1.2">Mobiconnect</text>
  <text x="96" y="220" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#52525B">Dirección A · «Instrumento de precisión» — el símbolo mide: tres barras ascendentes,</text>
  <text x="96" y="244" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#52525B">la lectura actual porta el único color de señal. Cobre: el metal de la conectividad y de Chile.</text>
</g>
<g id="lockup-horizontal">
  <rect x="96" y="320" width="520" height="200" fill="#FFFFFF" rx="12" stroke="#E7E5E4" stroke-width="1"/>

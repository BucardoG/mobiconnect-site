<g id="area-segura">
  <rect x="96" y="560" width="520" height="200" fill="#FFFFFF" rx="12" stroke="#E7E5E4" stroke-width="1"/>
  <text x="156" y="660" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#52525B">Con área clara ≥ x/2 alrededor del símbolo.</text>
  <text x="156" y="688" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#71717A">El símbolo nunca se separa del wordmark en uso normal.</text>
</g>
<g id="escala-minima">
  <rect x="656" y="560" width="200" height="200" fill="#FFFFFF" rx="12" stroke="#E7E5E4" stroke-width="1"/>

  <text x="756" y="730" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" fill="#71717A" text-anchor="middle">mín 24 px</text>
</g>
<g id="notas">
  <text x="96" y="800" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="500" fill="#B45309" letter-spacing="1.4">REGLAS</text>
  <text x="96" y="840" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#52525B">—  Nunca cápsula salvo badge/tag/avatar. Nunca mayúsculas en botones.</text>
  <text x="96" y="868" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#52525B">—  La señal solo marca acción o dato vivo: kicker, barra del logo, botón primario, medición.</text>
  <text x="96" y="896" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#71717A">—  Marca verificada libre en INAPI (Chile). Riesgo de convivencia: «MobiConnect» MDM, Inventit Inc. (Japón).</text>
</g>
<g id="footer">
  <line x1="96" y1="940" x2="1344" y2="940" stroke="#E7E5E4" stroke-width="1"/>

  <text x="136" y="2194" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#1C1917" letter-spacing="-0.6">Hable con quien construye.</text>
  <text x="136" y="2224" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#52525B">Contacto fundador-led: conversaciones técnicas directas, sin funnels.</text>
  <rect x="1104" y="2166" width="196" height="46" fill="#B45309" rx="6"/>

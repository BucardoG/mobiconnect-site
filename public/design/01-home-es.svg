<g id="ficha-sistema">
  <rect x="984" y="112" width="330" height="254" fill="#FFFFFF" rx="8" stroke="#E7E5E4" stroke-width="1"/>
  <rect x="984" y="112" width="3" height="254" fill="#B45309"/>
  <text x="1008" y="148" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" fill="#71717A" letter-spacing="1.2">FICHA DEL SISTEMA</text>
  <text x="1008" y="184" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" fill="#71717A" letter-spacing="1.1">GRUPO</text>
  <text x="1104" y="184" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#1C1917">INV. BUCARDO ZÚÑIGA</text>
  <line x1="1008" y1="214" x2="1290" y2="214" stroke="#E7E5E4" stroke-width="1"/>
  <text x="1008" y="222" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" fill="#71717A" letter-spacing="1.1">OPERADOR</text>
  <text x="1104" y="222" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#1C1917">AIRTIME CONNECT</text>
  <line x1="1008" y1="252" x2="1290" y2="252" stroke="#E7E5E4" stroke-width="1"/>
  <text x="1008" y="260" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" fill="#71717A" letter-spacing="1.1">LICENCIA</text>
  <text x="1104" y="260" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#1C1917">SUBTEL 114/260/427</text>
  <line x1="1008" y1="290" x2="1290" y2="290" stroke="#E7E5E4" stroke-width="1"/>
  <text x="1008" y="298" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" fill="#71717A" letter-spacing="1.1">PRESENCIA</text>
  <text x="1104" y="298" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#1C1917">7 PAÍSES · CL…MX</text>
  <line x1="1008" y1="328" x2="1290" y2="328" stroke="#E7E5E4" stroke-width="1"/>
  <text x="1008" y="336" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" fill="#71717A" letter-spacing="1.1">PRODUCTOS</text>
  <text x="1104" y="336" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#1C1917">ENTITLEMENTS·PEOPLE</text>
</g>
<line x1="96" y1="640" x2="1344" y2="640" stroke="#E7E5E4" stroke-width="1"/>
<g id="tesis">
  <text x="96" y="704" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="500" fill="#B45309" letter-spacing="1.4">TESIS</text>
  <text x="96" y="748" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#1C1917" letter-spacing="-0.6">El margen y el control no se regalan: se construyen.</text>
  <text x="96" y="806" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#52525B">El grupo construyó su operador — licencia SUBTEL en Chile, presencia en siete países — y</text>
  <text x="96" y="832" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#52525B">recuperó su infraestructura sobre hardware propio. Ese control no se delega: es la</text>
  <text x="96" y="858" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#52525B">condición de partida. Mobiconnect existe para convertir esa infraestructura soberana en</text>
  <text x="96" y="884" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#52525B">producto vendible, con la disciplina de ingeniería de un carrier y el ritmo de una casa</text>
  <text x="96" y="910" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#52525B">de software.</text>
</g>
<line x1="96" y1="984" x2="1344" y2="984" stroke="#E7E5E4" stroke-width="1"/>
<g id="productos-head">
  <text x="96" y="1048" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="500" fill="#B45309" letter-spacing="1.4">PRODUCTOS</text>
  <text x="96" y="1092" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#1C1917" letter-spacing="-0.6">Dos productos, una misma disciplina.</text>
  <text x="96" y="1150" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#52525B">Ambos nacen de necesidades reales del operador y se construyen sobre</text>
  <text x="96" y="1176" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#52525B">infraestructura propia.</text>
</g>
<g id="producto-1">
  <rect x="96" y="1210" width="604" height="400" fill="#FFFFFF" rx="10" stroke="#E7E5E4" stroke-width="1"/>
  <g transform="translate(132,1250) scale(0.9)">
  <rect x="2" y="2" width="4" height="28" fill="#1C1917" rx="1"/>
  <rect x="26" y="2" width="4" height="28" fill="#1C1917" rx="1"/>

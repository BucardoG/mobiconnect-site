<g id="hero">
  <text x="96" y="136" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="500" fill="#B45309" letter-spacing="1.4">PLATAFORMA DE AI Y HIGH-TECH · GRUPO INVERSIONES BUCARDO ZÚÑIGA</text>
  <text x="96" y="228" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="600" fill="#1C1917" letter-spacing="-1.2">La capa de inteligencia</text>
  <text x="96" y="298" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="600" fill="#1C1917" letter-spacing="-1.2">del operador soberano.</text>
  <text x="96" y="360" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="400" fill="#52525B">Mobiconnect diseña y opera los servicios que rodean a Airtime Connect, el operador del grupo:</text>
  <text x="96" y="386" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="400" fill="#52525B">la capa comercial de las APIs — planes, cuotas y medición — y el sistema de desempeño</text>
  <text x="96" y="412" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="400" fill="#52525B">para equipos híbridos de personas y agentes.</text>
</g>

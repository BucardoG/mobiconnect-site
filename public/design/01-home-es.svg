  <rect x="14" y="13" width="4" height="17" fill="#1C1917" rx="1"/>
  <rect x="20" y="7" width="4" height="23" fill="#B45309" rx="1"/>
  </g>
  <text x="132" y="1328" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#B45309" letter-spacing="1.4">P·01</text>
  <text x="132" y="1368" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#1C1917" letter-spacing="-0.6">Entitlements</text>
  <text x="132" y="1396" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#52525B">La capa comercial de las APIs: planes, cuotas, licencias y</text>
  <text x="132" y="1420" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#52525B">medición para operadores y plataformas que venden conectividad</text>
  <text x="132" y="1444" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#52525B">como producto.</text>
  <text x="132" y="1488" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">—  Planes, SKUs y cuotas por contrato</text>
  <text x="132" y="1516" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">—  Medición y aplicación en tiempo real</text>
  <text x="132" y="1544" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">—  Trials, upgrades y feature flags</text>
  <line x1="132" y1="1558" x2="664" y2="1558" stroke="#E7E5E4" stroke-width="1"/>
  <text x="132" y="1588" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#B45309">Ver producto  →</text>
</g>
<g id="producto-2">
  <rect x="740" y="1210" width="604" height="400" fill="#FFFFFF" rx="10" stroke="#E7E5E4" stroke-width="1"/>
  <g transform="translate(776,1250) scale(0.9)">
  <rect x="2" y="2" width="4" height="28" fill="#1C1917" rx="1"/>
  <rect x="26" y="2" width="4" height="28" fill="#1C1917" rx="1"/>
  <rect x="8" y="19" width="4" height="11" fill="#1C1917" rx="1"/>
  <rect x="14" y="13" width="4" height="17" fill="#1C1917" rx="1"/>
  <rect x="20" y="7" width="4" height="23" fill="#B45309" rx="1"/>
  </g>
  <text x="776" y="1328" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#B45309" letter-spacing="1.4">P·02</text>
  <text x="776" y="1368" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#1C1917" letter-spacing="-0.6">People</text>
  <text x="776" y="1396" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#52525B">Un sistema de RR.HH. diseñado desde cero para equipos híbridos:</text>
  <text x="776" y="1420" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#52525B">personas y agentes AI en el mismo registro, medidos por</text>
  <text x="776" y="1444" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#52525B">resultados.</text>
  <text x="776" y="1488" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">—  Personas y agentes en un solo registro</text>
  <text x="776" y="1516" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">—  Los agentes proponen, los humanos deciden</text>
  <text x="776" y="1544" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">—  Scorecards anclados a resultados</text>
  <line x1="776" y1="1558" x2="1308" y2="1558" stroke="#E7E5E4" stroke-width="1"/>
  <text x="776" y="1588" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#B45309">Ver producto  →</text>
</g>
<line x1="96" y1="1674" x2="1344" y2="1674" stroke="#E7E5E4" stroke-width="1"/>
<g id="grupo">
  <text x="96" y="1738" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="500" fill="#B45309" letter-spacing="1.4">EL GRUPO</text>
  <text x="96" y="1782" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#1C1917" letter-spacing="-0.6">Un operador real detrás de cada producto.</text>
  <text x="96" y="1840" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#52525B">Mobiconnect pertenece a Inversiones Bucardo Zúñiga: el grupo que construyó y</text>
  <text x="96" y="1866" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#52525B">opera un operador de telecomunicaciones licenciado en Chile. Cada producto</text>
  <text x="96" y="1892" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#52525B">nace de una necesidad real del operador — y se endurece ahí antes de salir al</text>
  <text x="96" y="1918" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#52525B">mercado.</text>
</g>

<line x1="0" y1="124" x2="1440" y2="124" stroke="#E7E5E4" stroke-width="1"/>
<g id="principio">
  <text x="96" y="176" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="500" fill="#B45309" letter-spacing="1.4">PRINCIPIO</text>
  <text x="96" y="228" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#1C1917" letter-spacing="-0.6">Mobiconnect se ve como un instrumento de medición.</text>
  <text x="96" y="264" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#52525B">Fondo claro, tinta casi negra, líneas de un píxel, datos en monoespaciada y un solo color de señal — cobre —</text>
  <text x="96" y="288" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#52525B">que solo aparece donde hay algo operable o verdadero. Nada decora; todo informa.</text>
</g>

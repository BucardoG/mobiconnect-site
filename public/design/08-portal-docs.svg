<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1405" viewBox="0 0 1440 1405">
<title>Mobiconnect — Portal · Docs Entitlements</title>
<rect x="0" y="0" width="1440" height="1405" fill="#FAFAF9"/>
<g id="nav">
  <g transform="translate(96,16) scale(0.66)">
  <rect x="2" y="2" width="4" height="28" fill="#1C1917" rx="1"/>
  <rect x="26" y="2" width="4" height="28" fill="#1C1917" rx="1"/>
  <rect x="8" y="19" width="4" height="11" fill="#1C1917" rx="1"/>
  <rect x="14" y="13" width="4" height="17" fill="#1C1917" rx="1"/>
  <rect x="20" y="7" width="4" height="23" fill="#B45309" rx="1"/>
  <text x="44" y="33" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#1C1917" letter-spacing="-0.5">mobiconnect</text>
  </g>
  <text x="426" y="39" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1C1917">Docs</text>
  <text x="496" y="39" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">Referencia API</text>
  <text x="658" y="39" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">Claves API</text>
  <text x="784" y="39" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">Try it</text>
  <rect x="978" y="14" width="165" height="22" fill="#FEF3E7" rx="11" stroke="#FDE6CE"/>
  <text x="1060.5" y="29" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#9A3412" text-anchor="middle">STAGING · SOLO PRUEBAS</text>
  <text x="1344" y="39" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12" font-weight="400" fill="#71717A" text-anchor="end">Docs EN</text>
  <line x1="0" y1="80" x2="1440" y2="80" stroke="#E7E5E4" stroke-width="1"/>
</g>
<g id="hero">
  <text x="96" y="128" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="500" fill="#B45309" letter-spacing="1.4">DEVELOPER PORTAL · ENTITLEMENTS</text>
  <text x="96" y="212" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="600" fill="#1C1917" letter-spacing="-1.2">Entitlements API</text>
  <text x="96" y="264" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="400" fill="#52525B">La capa comercial de las APIs del operador: planes, cuotas, licencias y medición,</text>
  <text x="96" y="290" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="400" fill="#52525B">con superficie alineada a CAMARA (GSMA). Decide en cada llamada; mide cada unidad.</text>
</g>
<g id="version">
  <rect x="1224" y="146" width="92" height="22" fill="#F5F5F4" rx="11"/>
  <text x="1270.0" y="161" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#52525B" text-anchor="middle">v1 · SemVer</text>
</g>
<line x1="96" y1="330" x2="1344" y2="330" stroke="#E7E5E4" stroke-width="1"/>
<g id="quickstart-head">
  <text x="96" y="386" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="500" fill="#B45309" letter-spacing="1.4">INICIO RÁPIDO</text>
  <text x="96" y="430" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#1C1917" letter-spacing="-0.6">Tu primera decisión autorizada, en tres movimientos.</text>
</g>
<line x1="126" y1="488" x2="914" y2="488" stroke="#D6D3D1" stroke-width="1"/>
<g id="paso-01">
  <circle cx="106" cy="488" r="20" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="106" y="493" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#B45309" text-anchor="middle">01</text>
  <text x="148" y="494" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#1C1917">Obtén tu clave</text>
  <text x="148" y="526" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">Crea una aplicación y una API key de</text>
  <text x="148" y="547" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">prueba en Claves API. El portal emite</text>
  <text x="148" y="568" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">claves atk_test_ para staging.</text>
</g>
<g id="paso-02">
  <circle cx="522" cy="488" r="20" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="522" y="493" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#B45309" text-anchor="middle">02</text>
  <text x="564" y="494" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#1C1917">Llama al check</text>
  <text x="564" y="526" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">Cada solicitud pasa por POST</text>
  <text x="564" y="547" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">/v1/entitlements/check: el PDP responde</text>
  <text x="564" y="568" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">allow o deny con la cuota restante.</text>
</g>
<g id="paso-03">
  <circle cx="938" cy="488" r="20" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="938" y="493" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#B45309" text-anchor="middle">03</text>
  <text x="980" y="494" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#1C1917">Consume medido</text>
  <text x="980" y="526" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">Cada unidad autorizada queda medida y</text>
  <text x="980" y="547" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">valorizada en el ledger de usage — el</text>
  <text x="980" y="568" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">cobro lo hace ABE.</text>
</g>
<g id="quickstart-curl">
  <rect x="96" y="629" width="700" height="330" fill="#F5F5F4" rx="10" stroke="#E7E5E4" stroke-width="1"/>
  <line x1="96" y1="669" x2="796" y2="669" stroke="#E7E5E4" stroke-width="1"/>
  <circle cx="120" cy="649" r="5" fill="#E7E5E4"/>
  <circle cx="138" cy="649" r="5" fill="#D6D3D1"/>
  <circle cx="156" cy="649" r="5" fill="#A8A29E"/>
  <text x="772" y="654" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="400" fill="#71717A" text-anchor="end">quickstart.sh — ejemplo ilustrativo</text>
  <text x="124" y="705" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#71717A"># 1) Token del entorno (client_credentials)</text>
  <text x="124" y="731" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#1C1917">curl -s -X POST </text>
  <text x="244.0" y="731" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#9A3412">$AUTH_URL/oauth/token</text>
  <text x="401.5" y="731" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#1C1917"> \</text>
  <text x="124" y="757" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#1C1917">  -d grant_type=client_credentials -d scope=entitlement:check</text>
  <text x="124" y="783" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#1C1917"></text>
  <text x="124" y="809" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#71717A"># 2) Decisión del PDP (SMS transaccional, cuota mensual)</text>
  <text x="124" y="835" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#1C1917">curl -s -X POST </text>
  <text x="244.0" y="835" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#9A3412">$API_URL/v1/entitlements/check</text>
  <text x="469.0" y="835" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#1C1917"> \</text>
  <text x="124" y="861" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#1C1917">  -H </text>
  <text x="161.5" y="861" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#92400E">&quot;Authorization: Bearer $TOKEN&quot;</text>
  <text x="386.5" y="861" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#1C1917"> \</text>
  <text x="124" y="887" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#1C1917">  -H </text>
  <text x="161.5" y="887" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#92400E">&quot;Idempotency-Key: 7f3c9a01-…-demo00000123&quot;</text>
  <text x="476.5" y="887" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#1C1917"> \</text>
  <text x="124" y="913" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#1C1917">  -d </text>
  <text x="161.5" y="913" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#92400E">&#x27;{&quot;tenant_id&quot;:&quot;…e001&quot;,&quot;product_code&quot;:&quot;sms.otp&quot;,&quot;quantity&quot;:1}&#x27;</text>
  <text x="124" y="939" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="400" fill="#71717A">Ejemplo ilustrativo del modelo de datos, no una respuesta real de la API.</text>
</g>
<g id="endpoints">
  <rect x="856" y="629" width="488" height="330" fill="#FFFFFF" rx="10" stroke="#E7E5E4" stroke-width="1"/>
  <text x="884" y="663" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" fill="#71717A" letter-spacing="1.2">ENDPOINTS DE LA SUPERFICIE</text>
  <rect x="884" y="682" width="42" height="20" fill="#F5F5F4" rx="4"/>
  <text x="905" y="695" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="10" font-weight="600" fill="#52525B" text-anchor="middle">POST</text>
  <text x="938" y="695" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="400" fill="#1C1917">/v1/entitlements/check — decisión (PDP)</text>
  <rect x="884" y="716" width="42" height="20" fill="#F5F5F4" rx="4"/>
  <text x="905" y="729" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="10" font-weight="600" fill="#52525B" text-anchor="middle">POST</text>
  <text x="938" y="729" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="400" fill="#1C1917">/v1/entitlements/release — compensación</text>
  <rect x="884" y="750" width="42" height="20" fill="#F5F5F4" rx="4"/>
  <text x="905" y="763" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="10" font-weight="600" fill="#52525B" text-anchor="middle">GET</text>
  <text x="938" y="763" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="400" fill="#1C1917">/v1/admin/catalog — catálogo y planes</text>
  <rect x="884" y="784" width="42" height="20" fill="#F5F5F4" rx="4"/>
  <text x="905" y="797" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="10" font-weight="600" fill="#52525B" text-anchor="middle">POST</text>
  <text x="938" y="797" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="400" fill="#1C1917">/v1/admin/subscriptions — alta de suscripción</text>
  <text x="884" y="931" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="400" fill="#71717A">Base URL: placeholder hasta GATE-3 — nunca hosts reales.</text>
</g>
<g id="cta">
  <rect x="96" y="1007" width="1248" height="200" fill="#FEF3E7" rx="12" stroke="#FDE6CE" stroke-width="1"/>
  <text x="136" y="1059" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="500" fill="#B45309" letter-spacing="1.4">CONTACTO</text>
  <text x="136" y="1111" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#1C1917" letter-spacing="-0.6">Hable con quien construye.</text>
  <text x="136" y="1141" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#52525B">Contacto fundador-led: conversaciones técnicas directas, sin funnels.</text>
  <rect x="1104" y="1083" width="196" height="46" fill="#B45309" rx="6"/>
  <text x="1202.0" y="1111.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">Iniciar conversación</text>
</g>
<g id="footer">
  <line x1="96" y1="1263" x2="1344" y2="1263" stroke="#E7E5E4" stroke-width="1"/>
  <g transform="translate(96,1295) scale(0.7)">
  <rect x="2" y="2" width="4" height="28" fill="#1C1917" rx="1"/>
  <rect x="26" y="2" width="4" height="28" fill="#1C1917" rx="1"/>
  <rect x="8" y="19" width="4" height="11" fill="#1C1917" rx="1"/>
  <rect x="14" y="13" width="4" height="17" fill="#1C1917" rx="1"/>
  <rect x="20" y="7" width="4" height="23" fill="#B45309" rx="1"/>
  <text x="44" y="33" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#1C1917" letter-spacing="-0.5">mobiconnect</text>
  </g>
  <text x="396" y="1319" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#71717A">Servicios de AI y high-tech para el operador soberano del grupo.</text>
  <text x="396" y="1341" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#52525B">Productos · Grupo · Contacto</text>
  <text x="1344" y="1319" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="400" fill="#71717A" text-anchor="end">© 2026 Mobiconnect — Inversiones Bucardo Zúñiga Limitada</text>
  <text x="1344" y="1341" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="400" fill="#71717A" text-anchor="end">Santiago de Chile</text>
</g>
</svg>

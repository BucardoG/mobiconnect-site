  <text x="44" y="33" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#1C1917" letter-spacing="-0.5">mobiconnect</text>
  </g>
  <text x="396" y="776" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#71717A">Servicios de AI y high-tech para el operador soberano del grupo.</text>
  <text x="396" y="798" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#52525B">Productos · Grupo · Contacto</text>
  <text x="1344" y="776" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="400" fill="#71717A" text-anchor="end">© 2026 Mobiconnect — Inversiones Bucardo Zúñiga Limitada</text>
  <text x="1344" y="798" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="400" fill="#71717A" text-anchor="end">Santiago de Chile</text>
</g>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="862" viewBox="0 0 1440 862">
<title>Mobiconnect — Portal · Try it</title>
<rect x="0" y="0" width="1440" height="862" fill="#FAFAF9"/>
<g id="nav">
  <g transform="translate(96,16) scale(0.66)">
  <rect x="2" y="2" width="4" height="28" fill="#1C1917" rx="1"/>
  <rect x="26" y="2" width="4" height="28" fill="#1C1917" rx="1"/>
  <rect x="8" y="19" width="4" height="11" fill="#1C1917" rx="1"/>
  <rect x="14" y="13" width="4" height="17" fill="#1C1917" rx="1"/>
  <rect x="20" y="7" width="4" height="23" fill="#0F766E" rx="1"/>
  <text x="44" y="33" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#1C1917" letter-spacing="-0.5">mobiconnect</text>
  </g>
  <text x="426" y="39" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1C1917">Docs</text>
  <text x="496" y="39" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">Referencia API</text>
  <text x="658" y="39" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">Claves API</text>
  <text x="784" y="39" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52525B">Try it</text>
  <rect x="978" y="14" width="165" height="22" fill="#F0FDFA" rx="11" stroke="#CCFBF1"/>
  <text x="1060.5" y="29" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#115E59" text-anchor="middle">STAGING · SOLO PRUEBAS</text>
  <text x="1344" y="39" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12" font-weight="400" fill="#71717A" text-anchor="end">Docs EN</text>
  <line x1="0" y1="80" x2="1440" y2="80" stroke="#E7E5E4" stroke-width="1"/>
</g>
<g id="encabezado">
  <text x="96" y="124" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#1C1917">Try it — staging</text>
  <text x="96" y="150" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#52525B">Prueba el PDP con claves de prueba. Sin precios: toda regla comercial queda fuera del portal.</text>
</g>
<g id="request">
  <rect x="96" y="180" width="610" height="278" fill="#F5F5F4" rx="10" stroke="#E7E5E4" stroke-width="1"/>
  <line x1="96" y1="220" x2="706" y2="220" stroke="#E7E5E4" stroke-width="1"/>
  <circle cx="120" cy="200" r="5" fill="#E7E5E4"/>
  <circle cx="138" cy="200" r="5" fill="#D6D3D1"/>
  <circle cx="156" cy="200" r="5" fill="#A8A29E"/>
  <text x="682" y="205" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="400" fill="#71717A" text-anchor="end">POST /v1/entitlements/check — request</text>
  <text x="124" y="256" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#1C1917">{</text>
  <text x="124" y="282" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#52525B">  &quot;tenant_id&quot;: </text>
  <text x="236.5" y="282" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#115E59">&quot;00000000-5e5e-…-e001&quot;</text>
  <text x="401.5" y="282" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#52525B">,</text>
  <text x="124" y="308" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#52525B">  &quot;product_code&quot;: </text>
  <text x="259.0" y="308" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#115E59">&quot;sms.otp&quot;</text>
  <text x="326.5" y="308" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#52525B">,</text>
  <text x="124" y="334" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#52525B">  &quot;scope&quot;: </text>
  <text x="206.5" y="334" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#115E59">&quot;send&quot;</text>
  <text x="251.5" y="334" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#52525B">,</text>
  <text x="124" y="360" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#52525B">  &quot;quantity&quot;: </text>
  <text x="229.0" y="360" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#115E59">1</text>
  <text x="236.5" y="360" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#52525B">,</text>
  <text x="124" y="386" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#52525B">  &quot;correlation_id&quot;: </text>
  <text x="274.0" y="386" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#115E59">&quot;7f3c9a01-…-demo00000123&quot;</text>
  <text x="124" y="412" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#1C1917">}</text>
  <text x="124" y="438" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="400" fill="#71717A">Ejemplo ilustrativo del modelo de datos, no una respuesta real de la API.</text>
</g>
<g id="response">
  <rect x="734" y="180" width="610" height="356" fill="#F5F5F4" rx="10" stroke="#E7E5E4" stroke-width="1"/>
  <line x1="734" y1="220" x2="1344" y2="220" stroke="#E7E5E4" stroke-width="1"/>
  <circle cx="758" cy="200" r="5" fill="#E7E5E4"/>
  <circle cx="776" cy="200" r="5" fill="#D6D3D1"/>
  <circle cx="794" cy="200" r="5" fill="#A8A29E"/>
  <text x="1320" y="205" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="400" fill="#71717A" text-anchor="end">response — 142 ms</text>
  <text x="762" y="256" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#52525B">HTTP/1.1 </text>
  <text x="829.5" y="256" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#15803D">200 OK</text>
  <text x="762" y="282" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#52525B">x-correlator: </text>
  <text x="867.0" y="282" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#115E59">b41d…9c02</text>
  <text x="762" y="308" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#1C1917"></text>
  <text x="762" y="334" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#1C1917">{</text>
  <text x="762" y="360" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#52525B">  &quot;allow&quot;: </text>
  <text x="844.5" y="360" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#15803D">true</text>
  <text x="874.5" y="360" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#52525B">,</text>
  <text x="762" y="386" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#52525B">  &quot;reason&quot;: </text>
  <text x="852.0" y="386" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#115E59">&quot;ok&quot;</text>
  <text x="882.0" y="386" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#52525B">,</text>
  <text x="762" y="412" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#52525B">  &quot;remaining_quota&quot;: </text>
  <text x="919.5" y="412" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#115E59">99941</text>
  <text x="957.0" y="412" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#52525B">,</text>
  <text x="762" y="438" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#52525B">  &quot;plan_id&quot;: </text>
  <text x="859.5" y="438" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#115E59">&quot;…c21f&quot;</text>
  <text x="912.0" y="438" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#52525B">,</text>
  <text x="762" y="464" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#52525B">  &quot;price_ref&quot;: </text>
  <text x="874.5" y="464" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#115E59">&quot;…88d0&quot;</text>
  <text x="762" y="490" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#1C1917">}</text>
  <text x="762" y="516" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="400" fill="#71717A">Ejemplo ilustrativo del modelo de datos, no una respuesta real de la API.</text>
</g>
<g id="notas">
  <line x1="96" y1="580" x2="1344" y2="580" stroke="#E7E5E4" stroke-width="1"/>
  <text x="96" y="608" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#52525B">—  Solo claves atk_test_: el try-it nunca expone producción.</text>
  <text x="96" y="632" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#52525B">—  Idempotency-Key opcional: un replay responde 409 duplicate_correlation_id.</text>
  <text x="96" y="656" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#52525B">—  Fail-closed: si el PDP no puede decidir, 503 {allow:false, pdp_unavailable}.</text>
  <text x="96" y="680" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#52525B">—  Cuota agotada no es error: responde 200 {allow:false, reason:quota_exceeded}.</text>
</g>
<g id="footer">
  <line x1="96" y1="720" x2="1344" y2="720" stroke="#E7E5E4" stroke-width="1"/>
  <g transform="translate(96,752) scale(0.7)">
  <rect x="2" y="2" width="4" height="28" fill="#1C1917" rx="1"/>
